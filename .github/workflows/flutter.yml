# 自动触发的配置（已注释）
# on:
#   push:
#     branches: [ "main" ]
#   pull_request:
#     branches: [ "main" ]

# 改为手动触发
on: workflow_dispatch

# 在 jobs 之前添加
permissions:
  contents: write  # 这给予了写入仓库内容的权限，包括创建 Release

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    steps:
      - uses: actions/checkout@v4
      
      # 添加新步骤：读取 pubspec.yaml 中的版本号
      - name: Get version from pubspec.yaml
        id: get_version
        run: |
          VERSION=$(grep 'version:' pubspec.yaml | sed 's/version: //')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.3'
          channel: 'stable'
          
      - name: Install dependencies
        run: flutter pub get
        
      - name: Analyze project source
        run: flutter analyze --no-fatal-infos
        
      - name: Create keystore
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/remind_me.jks
          echo "storeFile=remind_me.jks" > android/key.properties
          echo "storePassword=$KEYSTORE_PASSWORD" >> android/key.properties
          echo "keyPassword=$KEY_PASSWORD" >> android/key.properties
          echo "keyAlias=remind_me" >> android/key.properties
        
      - name: Build APK
        run: flutter build apk --release --target-platform android-arm64
        
      - name: Rename APK
        shell: bash
        run: |
          cd build/app/outputs/flutter-apk/
          mv app-release.apk "remind_me_v${{ steps.get_version.outputs.version }}_arm64.apk"
      
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: build/app/outputs/flutter-apk/remind_me_v${{ steps.get_version.outputs.version }}_arm64.apk
          tag_name: v${{ steps.get_version.outputs.version }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
