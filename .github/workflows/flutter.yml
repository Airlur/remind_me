# 自动触发的配置（已注释）
# on:
#   push:
#     branches: [ "main" ]
#   pull_request:
#     branches: [ "main" ]

# 改为手动触发
on: workflow_dispatch

# 在 jobs 之前添加
permissions:
  contents: write  # 这给予了写入仓库内容的权限，包括创建 Release

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      APP_VERSION: 0.1.0
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.3'
          channel: 'stable'
          
      - name: Install dependencies
        run: flutter pub get
        
      - name: Analyze project source
        # run: flutter analyze --no-fatal-infos
        run: flutter analyze --no-fatal-infos --ignore=unnecessary_string_interpolations --ignore=unnecessary_brace_in_string_interps --ignore=unused_import --ignore=sized_box_for_whitespace --ignore=use_build_context_synchronously --ignore=avoid_print --ignore=prefer_const_constructors
        
      - name: Create keystore
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/remind_me.jks
          echo "storeFile=remind_me.jks" > android/key.properties
          echo "storePassword=$KEYSTORE_PASSWORD" >> android/key.properties
          echo "keyPassword=$KEY_PASSWORD" >> android/key.properties
          echo "keyAlias=remind_me" >> android/key.properties
        
      - name: Build APK
        run: flutter build apk --release --target-platform android-arm64
        
      - name: Rename APK
        shell: bash
        run: |
          cd build/app/outputs/flutter-apk/
          mv app-release.apk "remind_me_v${{ env.APP_VERSION }}_arm64.apk"
      
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: build/app/outputs/flutter-apk/remind_me_v${{ env.APP_VERSION }}_arm64.apk
          tag_name: v${{ env.APP_VERSION }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
