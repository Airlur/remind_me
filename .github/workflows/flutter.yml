name: Flutter CI/CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      APP_VERSION: 0.1.0
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.3'
          channel: 'stable'
          
      - name: Install dependencies
        run: flutter pub get
        
      - name: Analyze project source
        run: flutter analyze --no-fatal-infos
        
      - name: Create keystore
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/remind_me.jks
          echo "storeFile=remind_me.jks" > android/key.properties
          echo "storePassword=$KEYSTORE_PASSWORD" >> android/key.properties
          echo "keyPassword=$KEY_PASSWORD" >> android/key.properties
          echo "keyAlias=remind_me" >> android/key.properties
        
      - name: Build APK
        run: flutter build apk --release --split-per-abi
        
      - name: Rename APKs
        shell: bash
        run: |
          cd build/app/outputs/flutter-apk/
          mv app-armeabi-v7a-release.apk "remind_me_v${{ env.APP_VERSION }}_arm32.apk"
          mv app-arm64-v8a-release.apk "remind_me_v${{ env.APP_VERSION }}_arm64.apk"
          mv app-x86_64-release.apk "remind_me_v${{ env.APP_VERSION }}_x64.apk"
      
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: "remind_me_v${{ env.APP_VERSION }}"
          path: build/app/outputs/flutter-apk/remind_me_v${{ env.APP_VERSION }}_*.apk
