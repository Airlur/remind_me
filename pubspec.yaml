name: remind_me
description: "一个简洁的时间管理应用."
publish_to: 'none'
version: 0.1.1+1

environment:
  sdk: '>=3.9.2 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  
  # UI相关
  flutter_screenutil: ^5.9.3
  cupertino_icons: ^1.0.8
  
  # 状态管理
  flutter_bloc: ^9.1.1
  hydrated_bloc: ^10.1.1
  
  # 存储
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.5.4
  
  # 依赖注入
  get_it: ^9.2.0
  
  # 网络
  dio: ^5.9.0
  connectivity_plus: ^7.0.0
  
  # 通知
  flutter_local_notifications: ^19.5.0
  # 工具
  intl: ^0.20.2
  logger: ^2.6.2
  path_provider: ^2.1.5
  permission_handler: ^12.0.1
  uuid: ^4.5.2
  collection: ^1.19.1
  # 设备信息
  device_info_plus: ^12.3.0
  package_info_plus: ^9.0.0

  # 滑动删除
  flutter_slidable: ^4.0.3
  # 值相等性比较
  equatable: ^2.0.7

  # 农历
  lunar: ^1.7.8

  # 时区
  timezone: ^0.10.1



dev_dependencies:
  flutter_test:
    sdk: flutter
  bloc_test: ^10.0.0
  flutter_lints: ^6.0.0
  build_runner: ^2.4.11
  hive_generator: ^2.0.1

flutter:
  generate: true
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - assets/images/


