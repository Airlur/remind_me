name: remind_me
description: "一个简洁的时间管理应用."
publish_to: 'none'
version: 0.1.1+1

environment:
  sdk: '>=3.2.3 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  
  # UI相关
  flutter_screenutil: ^5.9.0
  cupertino_icons: ^1.0.2
  
  # 状态管理
  flutter_bloc: ^8.1.3
  hydrated_bloc: ^9.1.2
  
  # 存储
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.2.2
  
  # 依赖注入
  get_it: ^7.6.4
  
  # 网络
  dio: ^5.3.3
  connectivity_plus: ^5.0.1
  
  # 通知
  flutter_local_notifications: ^18.0.1
  
  # 工具
  intl: ^0.19.0
  logger: ^2.0.2+1
  path_provider: ^2.1.1
  permission_handler: ^11.0.1
  uuid: ^4.0.0
  collection: ^1.18.0

  # 滑动删除
  flutter_slidable: ^3.0.1
  # 值相等性比较
  equatable: ^2.0.5

  # 农历
  lunar: ^1.6.1

  # 时区
  timezone: ^0.9.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  bloc_test: ^9.1.4
  flutter_lints: ^2.0.0
  build_runner: ^2.4.6
  hive_generator: ^2.0.1

flutter:
  generate: true
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - assets/images/


